name: Update NHTSA Tire Complaint Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 6'
      timezone: 'America/New_York'

permissions:
  contents: read

concurrency:
  group: nhtsa-complaint-sheet-update
  cancel-in-progress: false

jobs:
  update-complaints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Update tire complaint data
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python update_complaints.py
