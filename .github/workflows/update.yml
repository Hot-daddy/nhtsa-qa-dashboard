name: Weekly NHTSA Data Update

on:
  schedule:
    - cron: '0 12 * * 5' # 매주 금요일
  workflow_dispatch:

jobs:
  update-sheet:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4  # v3에서 v4로 업데이트 (경고 해결)

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5 # v4에서 v5로 업데이트 (경고 해결)
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests gspread oauth2client

    - name: 데이터 업데이트 스크립트 실행
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: python update_data.py
