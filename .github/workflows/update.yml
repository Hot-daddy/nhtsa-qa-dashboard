name: Weekly NHTSA Data Update

on:
  schedule:
    - cron: '0 3 * * 5' # 한국 시간(KST) 매주 금요일 오후 12시 (UTC 03:00)
  workflow_dispatch: # 언제든 수동으로 실행할 수 있는 버튼 활성화

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install pandas requests gspread gspread-dataframe oauth2client

      - name: 데이터 업데이트 스크립트 실행
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python update_data.py
